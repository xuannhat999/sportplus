<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản - SportPlus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="../css/main.css" rel="stylesheet">
</head>

<body data-root="../" data-page="account">
  <header class="header" id="header">
    <nav class="left">
      <a href="../index.html" class="header__name">SportPlus</a>
    </nav>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-bar__icon"></i>
      <form class="search-bar__form" action="../pages/products_search.html" method="get">
        <input class="search-bar__input" type="search" placeholder="Tìm sản phẩm" aria-label="Tìm kiếm sản phẩm">
      </form>
    </div>
    <button class="btn-cart" type="button" aria-label="Giỏ hàng">
      <i class="fa-solid fa-cart-shopping btn-cart__icon"></i>
    </button>

    <a href="orders.html" class="btn-cart__icon">
      <i class="fa-solid fa-list"></i>
    </a>

    <button class="btn-account" type="button" aria-label="Tài khoản">
      <i class="fa-solid fa-user btn-account__icon"></i>
    </button>
    <nav class="header-filters" id="header-filters" aria-label="Lọc sản phẩm"></nav>
  </header>
  <main>
    <section class="account-page" id="account-page">
      <div id="account-info" class="account-page__info"></div>

      <!-- CHƯA ĐĂNG NHẬP -->
      <template id="account-empty-tpl">
        <div class="account__empty">
          <p class="account__empty-text"></p>
          <button class="account__btn-login" type="button">Đăng nhập</button>
        </div>
      </template>

      <template id="account-tpl">
        <article class="account">
          <header class="account__header">
            <h1 class="account__title">Thông tin tài khoản</h1>
            <p class="account__subtitle">Tài khoản đang đăng nhập trên hệ thống</p>
          </header>

          <dl class="account__list">
            <div class="account__row">
              <dt class="account__label">Họ và tên</dt>
              <dd class="account__value" data-field="name"></dd>
            </div>
            <div class="account__row">
              <dt class="account__label">Email</dt>
              <dd class="account__value account__value--field">
                <div class="field">
                  <input class="field__input" id="account-email" data-field="email" type="email" autocomplete="email"
                    placeholder="Email" aria-label="Email">
                  <p class="field__hint field__hint--error" data-error="email" role="alert" hidden></p>
                </div>
              </dd>
            </div>
            <div class="account__row">
              <dt class="account__label">Số điện thoại</dt>
              <dd class="account__value account__value--field">
                <div class="field">
                  <input class="field__input" id="account-phone" data-field="phone" type="tel" autocomplete="tel"
                    inputmode="tel" maxlength="11" placeholder="Số điện thoại" aria-label="Số điện thoại">
                  <p class="field__hint field__hint--error" data-error="phone" role="alert" hidden></p>
                </div>
              </dd>
            </div>
            <div class="account__row">
              <dt class="account__label">Địa chỉ</dt>
              <dd class="account__value account__value--field">
                <div class="field">
                  <input class="field__input" id="address" data-field="address" type="text" placeholder="Số điện thoại"
                    aria-label="Địa chỉ">
                  <p class="field__hint field__hint--error" data-error="address" role="alert" hidden></p>
                </div>
              </dd>
            </div>

            <div class="account__row">
              <dt class="account__label">Phương thức thanh toán</dt>
              <dd class="account__value account__value--field">
                <div class="field">
                  <select class="field__select" id="account-pay-method" data-field="pay_method"
                    aria-label="Phương thức thanh toán">
                    <option value="online">Thanh toán trực tuyến</option>
                    <option value="cash">Thanh toán khi nhận hàng</option>
                  </select>
                  <p class="field__hint" data-hint="pay_method" hidden></p>
                </div>
              </dd>
            </div>
            <div class="account__row">
              <dt class="account__label">Vai trò</dt>
              <dd class="account__value" data-field="role"></dd>
            </div>
            <div class="account__row">
              <dt class="account__label">Trạng thái</dt>
              <dd class="account__value" data-field="status"></dd>
            </div>
          </dl>

          <button class="account__btn-logout" type="button">Đăng xuất</button>

        </article>
      </template>
    </section>
  </main>
  <footer class="footer" id="footer">
    <div class="footer__grid">
      <div class="footer__brand">
        <a href="../index.html" class="footer__name">SportPlus</a>
        <p class="footer__desc">Cửa hàng áo bóng đá: áo đội tuyển quốc gia và áo câu lạc bộ.</p>
      </div>
      <div class="footer__col">
        <h4 class="footer__title">Mua sắm</h4>
        <ul class="footer__list">
          <li><a class="footer__link" href="../index.html">Trang chủ</a></li>
          <li><a class="footer__link" href="../index.html">Áo đội tuyển</a></li>
          <li><a class="footer__link" href="../index.html">Áo câu lạc bộ</a></li>
          <li><a class="footer__link" href="../pages/cart.html">Giỏ hàng</a></li>
        </ul>
      </div>
      <div class="footer__col">
        <h4 class="footer__title">Tài khoản</h4>
        <ul class="footer__list">
          <li><a class="footer__link" href="../pages/account.html">Thông tin</a></li>
          <li><a class="footer__link" href="../pages/orders.html">Lịch sử mua hàng</a></li>
        </ul>
      </div>
      <div class="footer__col">
        <h4 class="footer__title">Liên hệ</h4>
        <p class="footer__text">Email: support@sportplus.vn</p>
        <p class="footer__text">Hotline: 1900 0000</p>
      </div>
    </div>
    <div class="footer__bottom">© 2026 SportPlus.</div>
  </footer>

  <script src="../js/data/products.js"></script>
  <script src="../js/data/users.js"></script>
  <script src="../js/utils/path.js"></script>
  <script src="../js/services/products_service.js"></script>
  <script src="../js/services/cart_service.js"></script>
  <script src="../js/services/user_service.js"></script>
  <script src="../js/components/btnCart.js" defer></script>
  <script src="../js/components/btnAccount.js" defer></script>
  <script src="../js/components/userFields.js"></script>
  <script src="../js/components/account.js"></script>
  <script src="../js/components/headerFilter.js"></script>
  <script src="../js/main.js" defer></script>
</body>

</html>
