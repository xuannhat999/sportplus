<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng - SportPlus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="../css/main.css" rel="stylesheet">
</head>

<body data-root="../" data-page="cart">
  <div id="header-container"></div>
  <main>
    <section class="cart-page" id="cart-page">
      <div id="cart-list"></div>

      <template id="cart-tpl">
        <div class="cart-layout">
          <!-- THÔNG TIN GIAO HÀNG (1/3 bên trái) -->
          <aside class="cart-user">
            <h2 class="cart-user__title">Thông tin giao hàng</h2>

            <div class="cart-user__field">
              <div class="field">
                <label class="field__label" for="cart-address">Địa chỉ</label>
                <input class="field__input" id="cart-address" data-field="address" type="text"
                  autocomplete="street-address" placeholder="Nhập địa chỉ">
                <p class="field__hint" data-hint="address" hidden></p>
              </div>
            </div>

            <div class="cart-user__field">
              <div class="field">
                <label class="field__label" for="cart-pay-method">Phương thức thanh toán</label>
                <select class="field__select" id="cart-pay-method" data-field="pay_method"
                  aria-label="Phương thức thanh toán">
                  <option value="online">Thanh toán trực tuyến</option>
                  <option value="cash">Thanh toán khi nhận hàng</option>
                </select>
                <p class="field__hint" data-hint="pay_method" hidden></p>
              </div>
            </div>
          </aside>

          <!-- GIỎ HÀNG (2/3 bên phải) -->
          <div class="cart">
            <div class="cart__head">
              <h1 class="cart__title">Giỏ hàng</h1>
              <p class="cart__count"></p>
            </div>

            <p class="cart__message" data-cart-message hidden></p>

            <div class="cart-table-wrap">
              <table class="cart-table">
                <thead>
                  <tr>
                    <th class="cart-table__th cart-table__th--check">
                      <input type="checkbox" class="cart-table__check" data-check-all
                        aria-label="Chọn tất cả sản phẩm">
                    </th>
                    <th class="cart-table__th cart-table__th--product">Sản phẩm</th>
                    <th class="cart-table__th cart-table__th--price">Giá</th>
                    <th class="cart-table__th cart-table__th--size">Size</th>
                    <th class="cart-table__th cart-table__th--quantity">Số lượng</th>
                    <th class="cart-table__th cart-table__th--total">Thành tiền</th>
                    <th class="cart-table__th cart-table__th--remove"></th>
                  </tr>
                </thead>
                <tbody data-cart-rows></tbody>
              </table>
            </div>

            <div class="cart__summary">
              <div class="cart__summary__info">
                <p class="cart__summary__text" data-summary="count"></p>
                <p class="cart__summary__total" data-summary="total"></p>
              </div>
              <div class="cart__summary__actions">
                <button class="cart__btn cart__btn--ghost" type="button" data-action="remove-selected">Xoá đã chọn</button>
                <button class="cart__btn cart__btn--primary" type="button" data-action="checkout">Thanh toán</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template id="cart-row-tpl">
        <tr class="cart-table__row">
          <td class="cart-table__cell cart-table__cell--check">
            <input type="checkbox" class="cart-table__check" data-row-check aria-label="Chọn sản phẩm">
          </td>
          <td class="cart-table__cell cart-table__cell--product">
            <a class="cart-table__product" data-row-link href="#">
              <img class="cart-table__image" data-row-image loading="lazy" alt="">
              <div class="cart-table__info">
                <p class="cart-table__name" data-row-name></p>
                <p class="cart-table__meta" data-row-meta></p>
              </div>
            </a>
          </td>
          <td class="cart-table__cell cart-table__cell--price" data-row-price></td>
          <td class="cart-table__cell cart-table__cell--size">
            <select class="cart-table__select" data-row-size aria-label="Chọn size"></select>
          </td>
          <td class="cart-table__cell cart-table__cell--quantity" data-row-quantity></td>
          <td class="cart-table__cell cart-table__cell--total" data-row-total></td>
          <td class="cart-table__cell cart-table__cell--remove">
            <button class="cart-table__remove" type="button" data-row-remove aria-label="Xoá sản phẩm">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      </template>

      <!-- GIỎ HÀNG RỖNG -->
      <template id="cart-empty-tpl">
        <div class="cart__empty">
          <i class="fa-solid fa-cart-shopping cart__empty-icon"></i>
          <p class="cart__empty-text" data-empty-text></p>
          <p class="cart__message" data-cart-message hidden></p>
          <button class="cart__btn cart__btn--primary" type="button" data-empty-login>Đăng nhập</button>
          <a class="cart__btn cart__btn--primary" data-empty-link href="#">Tiếp tục mua sắm</a>
        </div>
      </template>
    </section>
  </main>
  <div id="footer-container"></div>

  <script src="../js/data/products.js"></script>
  <script src="../js/data/users.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/path.js"></script>
  <script src="../js/utils/product.js"></script>

  <script src="../js/services/storage_service.js"></script>
  <script src="../js/services/products_service.js"></script>
  <script src="../js/services/user_service.js"></script>
  <script src="../js/data/models/cart_item_model.js"></script>
  <script src="../js/data/models/order_detail_model.js"></script>
  <script src="../js/data/models/order_model.js"></script>
  <script src="../js/services/cart_service.js"></script>
  <script src="../js/services/order_service.js"></script>

  <script src="../js/components/header.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/btnCart.js" defer></script>
  <script src="../js/components/btnAccount.js" defer></script>
  <script src="../js/components/quantity.js"></script>
  <script src="../js/components/userFields.js"></script>
  <script src="../js/components/cart.js"></script>
  <script src="../js/components/products.js"></script>

  <script src="../js/init.js"></script>
  <script src="../js/main.js" defer></script>
</body>

</html>
