<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết sản phẩm - SportPlus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="../css/main.css" rel="stylesheet">
</head>

<body data-root="../" data-page="product_detail">
  <div id="header-container"></div>
  <main>
    <div id="product-detail"></div>
    <template id="product-detail-tpl">
      <article class="product-detail">
        <div class="product-detail__images">
          <img class="product-detail__image__main" alt="">
          <div class="product-detail__images__other">
            <img class="product-detail__image__other-1" alt="">
            <img class="product-detail__image__other-2" alt="">
          </div>
        </div>
        <div class="product-detail__info">
          <p class="product-detail__brand"></p>
          <h1 class="product-detail__name"></h1>
          <div class="product-detail__prices">
            <span class="product-detail__price-old" hidden></span>
            <span class="product-detail__price"></span>
            <span class="product-detail__discount" hidden></span>
          </div>
          <p class="product-detail__meta"></p>
          <div class="product-detail__sizes" role="group" aria-label="Chọn size">
            <p class="product-detail__sizes-label">Size</p>
            <div class="product-detail__size-list"></div>
          </div>
          <div class="product-detail__quantity">
            <p class="product-detail__quantity-label">Số lượng</p>
            <div class="product-detail__qty">
              <button class="product-detail__qty-btn product-detail__qty-minus" type="button" aria-label="Giảm số lượng">−</button>
              <input class="product-detail__qty-input" type="number" value="1" min="1" max="99" step="1" inputmode="numeric" aria-label="Số lượng">
              <button class="product-detail__qty-btn product-detail__qty-plus" type="button" aria-label="Tăng số lượng">+</button>
            </div>
          </div>
          <button class="product-detail__add-to-cart" type="button">Thêm vào giỏ</button>
        </div>
      </article>
    </template>
  </main>
  <div id="footer-container"></div>

  <script src="../js/data/products.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/path.js"></script>
  <script src="../js/utils/product.js"></script>

  <script src="../js/services/storage_service.js"></script>
  <script src="../js/services/products_service.js"></script>

  <script src="../js/components/header.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/btnCart.js" defer></script>
  <script src="../js/components/btnAccount.js" defer></script>
  <script src="../js/components/productDetail.js"></script>
  <script src="../js/init.js"></script>
  <script src="../js/main.js" defer></script>
</body>

</html>
