<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết sản phẩm - SportPlus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="../css/main.css" rel="stylesheet">
</head>

<body data-root="../" data-page="product_detail">
  <div id="header-container"></div>
  <main>
    <section class="product-detail" id="product-detail">
      <template id="product-not-found-tpl">
        <div class="p-detail__empty">
          <p>Không tìm thấy sản phẩm.</p>
          <a class="p-detail__back" href="#" data-back-home>← Về trang chủ</a>
        </div>
      </template>

      <template id="product-detail-tpl">
        <article class="p-detail">
          <div class="p-detail__media">
            <img class="p-detail__media__main" alt="">
            <div class="p-detail__media__thumbs">
              <img class="p-detail__media__thumb__1" alt="">
              <img class="p-detail__media__thumb__2" alt="">
            </div>
          </div>
          <div class="p-detail__summary">
            <div class="p-detail__summary__info">
              <h1 class="p-detail__summary__info__name">
              </h1>
              <p class="p-detail__summary__info__brand"></p>
              <p class="p-detail__summary__info__meta"></p>
              <p class="p-detail__summary__info__season"></p>
              <p class="p-detail__summary__info__kit-type"></p>
              <div class="p-detail__summary__info__prices">
                <span class="p-detail__summary__info__price-old" hidden></span>
                <span class="p-detail__summary__info__price"></span>
                <span class="p-detail__summary__info__discount" hidden></span>
              </div>
            </div>
            <div class="p-detail__summary__purchase">
              <div class="p-detail__summary__purchase__sizes" role="group" aria-label="Chọn size">
                <p class="p-detail__summary__purchase__sizes-label">Size</p>
                <div class="p-detail__summary__purchase__size-list"></div>
              </div>
              <div class="p-detail__summary__purchase__quantity">
                <p class="p-detail__summary__purchase__quantity-label">Số lượng</p>
                <div class="p-detail__summary__purchase__quantity__control" data-quantity></div>
              </div>
              <button class="p-detail__summary__purchase__btn-add-to-cart" type="button">Thêm vào giỏ</button>
              <p class="p-detail__summary__purchase__message" hidden></p>
            </div>
          </div>
        </article>
      </template>
    </section>
    <section class="r-products">
      <p class="r-products__title">Sản phẩm liên quan</p>
      <p class="products-empty" data-products-empty hidden>Chưa có sản phẩm nào.</p>
      <div id="products" class="r-products__products">
        <template id="products-tpl">
          <article class="products-article">
            <a class="product">
              <img class="product__image" loading="lazy">
              <div class="product__info">
                <h3 class="product__name"></h3>
                <div class="product__prices">
                  <span class="product__price-old" hidden></span>
                  <span class="product__price"></span>
                </div>
              </div>
            </a>
          </article>
        </template>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>
  <script src="../js/data/products.js"></script>
  <script src="../js/data/users.js"></script>
  <script src="../js/data/categories.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/path.js"></script>
  <script src="../js/utils/product.js"></script>

  <script src="../js/services/storage_service.js"></script>
  <script src="../js/services/products_service.js"></script>
  <script src="../js/data/models/cart_item_model.js"></script>
  <script src="../js/services/cart_service.js"></script>
  <script src="../js/services/user_service.js"></script>

  <script src="../js/components/header.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/btnCart.js" defer></script>
  <script src="../js/components/btnAccount.js" defer></script>
  <script src="../js/components/quantity.js"></script>
  <script src="../js/components/products.js"></script>
  <script src="../js/components/productDetail.js"></script>
  <script src="../js/init.js"></script>
  <script src="../js/main.js" defer></script>
</body>

</html>
