<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="../css/main.css" rel="stylesheet">
</head>

<body data-root="../" data-page="login">
  <div id="header-container"></div>
  <main class="page-auth">
    <div class="div-input">
      <form class="form-email">
        <input class="form-email__input" placeholder="Email" type="email">
      </form>
      <form class="form-password">
        <input class="form-password__input" placeholder="Password" type="password">
      </form>
      <button class="btn-forget">Quên mật khẩu?</button>
      <button class="btn-sign_in">Đăng nhập</button>
      <button class="btn-sign_up">Đăng kí</button>
    </div>
  </main>
  <div id="footer-container"></div>

  <script src="../js/components/header.js"></script>
  <script src="../js/components/footer.js"></script>
</body>

</html>
